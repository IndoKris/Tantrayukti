; EcoTrack ESP32 true-power meter.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; Copy include/config.example.h to include/config.h and fill it in first;
; config.h is gitignored because it holds the WiFi password and the device token.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Pinned so a build is reproducible. EmonLib does the RMS and real-power maths;
; ArduinoJson builds the payload; Preferences (bundled) backs the flash buffer.
lib_deps =
    openenergymonitor/EmonLib@^1.1.0
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=1

; Larger partition for the flash ring buffer used during an outage.
board_build.partitions = default.csv

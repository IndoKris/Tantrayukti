[project]
name = "backend"
version = "0.1.0"
description = "EcoTrack backend - energy, cost and CO2 monitoring API (Django + DRF)"
readme = "README.md"
# Relaxed from ">=3.13" (see AUDIT.md Q1): 3.12 is the interpreter available here and
# has the widest TensorFlow/Keras wheel coverage for the Phase 11 forecasting work.
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "dj-database-url>=2.2",
    "python-dotenv>=1.0",
    "djangorestframework-simplejwt>=5.3",
]

# Machine-learning stack. Separated so a deployment that only serves the API can
# install the base dependencies and skip ~100 MB of numerical libraries.
[project.optional-dependencies]
ml = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]
# Keras/TensorFlow is a separate extra: it is a large download, and the training
# code falls back to a scikit-learn model when it is absent (see
# ml/training/backends.py). Install with: uv sync --extra ml --extra deep
deep = [
    "tensorflow>=2.16",
]

# Only needed when DATABASE_URL points at PostgreSQL; SQLite is the documented fallback.
postgres = ["psycopg[binary]>=3.2"]

[tool.uv]
package = false
